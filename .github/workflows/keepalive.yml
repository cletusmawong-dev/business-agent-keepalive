# Keeps the Business Agent instance on Render's free tier from spinning down.
# Public repo on purpose: scheduled workflows are unlimited on public repositories,
# and no application code lives here — only this workflow.
name: keepalive

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub's minimum; free instances sleep after ~15 min idle
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake the service and confirm it answers
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 100 \
              https://business-agent-u9e6.onrender.com/health/ready || true)
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 25
          done
          echo "no 200 after 3 attempts (cold start can take ~60s)"
          exit 1
